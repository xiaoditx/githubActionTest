name: MinGW Build Test (4 Configurations)

on:
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        DEBUG: [ 0, 1 ]
        ARCH: [ 32, 64 ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 1. 安装 MSYS2 及 MinGW 工具链（32位 + 64位）
      - name: Setup MSYS2 & MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64          # 默认环境，不影响后续添加 PATH
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc

      # 2. 将 MinGW bin 目录添加到 PATH（确保 cmd 能找到编译器）
      - name: Add MinGW bins to PATH
        run: |
          echo "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      # 3. 诊断并确保 32 位编译器已正确安装（若缺失则重新安装）
      - name: Verify and fix 32-bit compiler
        shell: powershell
        run: |
          $mingw32gpp = "C:\msys64\mingw32\bin\i686-w64-mingw32-g++.exe"
          if (Test-Path $mingw32gpp) {
              Write-Host "✅ 32-bit compiler found: $mingw32gpp"
              & $mingw32gpp --version
          } else {
              Write-Host "❌ 32-bit compiler missing, reinstalling via MSYS2..."
              C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-i686-gcc"
              if (Test-Path $mingw32gpp) {
                  Write-Host "✅ Reinstall succeeded."
                  & $mingw32gpp --version
              } else {
                  Write-Host "❌ Reinstall failed. Listing directory:"
                  dir C:\msys64\mingw32\bin\i686*.exe
                  exit 1
              }
          }

      # 4. 验证所有必需工具在 cmd 环境中可用
      - name: Verify toolchain in cmd
        shell: cmd
        run: |
          echo "=== Checking 32-bit compiler (i686) ==="
          where i686-w64-mingw32-g++
          i686-w64-mingw32-g++ --version
          echo.
          echo "=== Checking 64-bit compiler (x86_64) ==="
          where x86_64-w64-mingw32-g++
          x86_64-w64-mingw32-g++ --version
          echo.
          echo "=== Checking make ==="
          where make
          make --version
          echo.
          echo "=== Checking windres ==="
          where windres
          windres --version
          echo.
          echo "✅ All required tools are available."

      # 5. 执行 make 编译（矩阵组合）
      - name: Run make (DEBUG=${{ matrix.DEBUG }}, ARCH=${{ matrix.ARCH }})
        shell: cmd
        run: |
          echo "Running make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}"
          echo "Current directory: %CD%"
          echo "PATH: %PATH%"
          make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}
          if %errorlevel% neq 0 (
              echo "⚠️ Make failed with exit code %errorlevel%, retrying..."
              make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}
              if %errorlevel% neq 0 (
                  echo "⚠️ Make failed again with exit code %errorlevel%, retrying one more time..."
                  make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}
              )
          )