name: MinGW Build Test (4 Configurations)

on:
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        DEBUG: [ 0, 1 ]
        ARCH: [ 32, 64 ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 1. 安装 MSYS2 及 MinGW 工具链（32位 + 64位）
      - name: Setup MSYS2 & MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc

      # 2. 将 MinGW bin 目录添加到 PATH
      - name: Add MinGW bins to PATH
        run: |
          echo "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      # 3. 确保 32 位编译器存在（32位构建正常后此步可保留作为保险）
      - name: Verify 32-bit compiler
        shell: powershell
        run: |
          $mingw32gpp = "C:\msys64\mingw32\bin\i686-w64-mingw32-g++.exe"
          if (Test-Path $mingw32gpp) {
              Write-Host "✅ 32-bit compiler found"
              & $mingw32gpp --version
          } else {
              Write-Host "❌ 32-bit compiler missing, reinstalling..."
              C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-i686-gcc"
          }

      # 4. 验证所有工具可用
      - name: Verify toolchain in cmd
        shell: cmd
        run: |
          echo "=== 32-bit compiler (i686) ==="
          where i686-w64-mingw32-g++
          i686-w64-mingw32-g++ --version
          echo.
          echo "=== 64-bit compiler (x86_64) ==="
          where x86_64-w64-mingw32-g++
          x86_64-w64-mingw32-g++ --version
          echo.
          echo "=== make ==="
          where make
          make --version
          echo.
          echo "=== windres ==="
          where windres
          windres --version
          echo.
          echo "✅ All tools available."

      # 5. 执行 make 编译（矩阵组合）- 通过命令行传递正确的 WINDRES_FLAG
      - name: Run make (DEBUG=${{ matrix.DEBUG }}, ARCH=${{ matrix.ARCH }})
        shell: cmd
        run: |
          set "WINDRES_FLAG=-F pe-i386"
          if "${{ matrix.ARCH }}"=="64" set "WINDRES_FLAG=-F pe-x86-64"
          echo "Running make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES_FLAG=%WINDRES_FLAG%"
          echo "Current directory: %CD%"
          echo "PATH: %PATH%"
          make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES_FLAG=%WINDRES_FLAG%
          if %errorlevel% neq 0 (
              echo "⚠️ Make failed with exit code %errorlevel%, retrying..."
              make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES_FLAG=%WINDRES_FLAG%
              if %errorlevel% neq 0 (
                  echo "⚠️ Make failed again with exit code %errorlevel%, retrying one more time..."
                  make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES_FLAG=%WINDRES_FLAG%
              )
          )