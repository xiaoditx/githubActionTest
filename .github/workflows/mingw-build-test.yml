name: MinGW Build Test (4 Configurations)

on:
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        DEBUG: [ 0, 1 ]
        ARCH: [ 32, 64 ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 1. 安装 MSYS2 及 MinGW 工具链（32位 + 64位）
      - name: Setup MSYS2 & MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc

      # 2. 将 MinGW bin 目录添加到 PATH
      - name: Add MinGW bins to PATH
        run: |
          echo "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      # 3. 确保 32 位编译器存在（诊断/修复）
      - name: Verify and fix 32-bit compiler
        shell: powershell
        run: |
          $mingw32gpp = "C:\msys64\mingw32\bin\i686-w64-mingw32-g++.exe"
          if (Test-Path $mingw32gpp) {
              Write-Host "✅ 32-bit compiler found"
              & $mingw32gpp --version
          } else {
              Write-Host "❌ 32-bit compiler missing, reinstalling..."
              C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-i686-gcc"
              if (Test-Path $mingw32gpp) {
                  Write-Host "✅ Reinstall succeeded."
              } else {
                  Write-Host "❌ Reinstall failed."
                  exit 1
              }
          }

      # 4. 验证工具链（包括 windres）
      - name: Verify toolchain in cmd
        shell: cmd
        run: |
          echo "=== Checking 32-bit compiler ==="
          where i686-w64-mingw32-g++
          i686-w64-mingw32-g++ --version
          echo.
          echo "=== Checking 64-bit compiler ==="
          where x86_64-w64-mingw32-g++
          x86_64-w64-mingw32-g++ --version
          echo.
          echo "=== Checking windres variants ==="
          where i686-w64-mingw32-windres
          i686-w64-mingw32-windres --version
          where x86_64-w64-mingw32-windres
          x86_64-w64-mingw32-windres --version
          echo.
          echo "=== Checking make ==="
          where make
          make --version

      # 5. 根据 ARCH 设置正确的 WINDRES 变量（解决64位 windres 架构检测失败）
      - name: Set WINDRES for target architecture
        shell: cmd
        run: |
          if "%{{ matrix.ARCH }}"=="32" (
            echo WINDRES=i686-w64-mingw32-windres>> %GITHUB_ENV%
          ) else (
            echo WINDRES=x86_64-w64-mingw32-windres>> %GITHUB_ENV%
          )
        # 注意：使用 %{{ ... }} 是为了避免 GitHub Actions 表达式冲突，实际应使用 ${{ ... }}

      # 6. 执行 make 编译（传递 WINDRES 变量）
      - name: Run make (DEBUG=${{ matrix.DEBUG }}, ARCH=${{ matrix.ARCH }})
        shell: cmd
        run: |
          echo "Running make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}"
          echo "Using WINDRES=%WINDRES%"
          make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES=%WINDRES%
          if %errorlevel% neq 0 (
              echo "⚠️ Make failed with exit code %errorlevel%, retrying..."
              make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES=%WINDRES%
              if %errorlevel% neq 0 (
                  echo "⚠️ Make failed again with exit code %errorlevel%, retrying one more time..."
                  make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }} WINDRES=%WINDRES%
              )
          )