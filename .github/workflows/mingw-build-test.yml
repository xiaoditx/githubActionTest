name: MinGW Build Test (4 Configurations)

on:
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        DEBUG: [ 0, 1 ]
        ARCH: [ 32, 64 ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 步骤1：安装 MSYS2 及 MinGW 工具链（32位 + 64位）
      - name: Setup MSYS2 & MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64          # 默认环境，不影响后续 PATH 添加
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc

      # 步骤2：将 MinGW bin 目录添加到 PATH（关键修复）
      - name: Add MinGW bins to PATH
        run: |
          echo "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 步骤3：验证编译器及 make 是否就绪
      - name: Verify toolchain in cmd
        shell: cmd
        run: |
          echo "=== Checking i686 compiler (32-bit) ==="
          where i686-w64-mingw32-g++
          i686-w64-mingw32-g++ --version
          echo.
          echo "=== Checking x86_64 compiler (64-bit) ==="
          where x86_64-w64-mingw32-g++
          x86_64-w64-mingw32-g++ --version
          echo.
          echo "=== Checking make ==="
          where make
          make --version

      # 步骤4：执行 make 编译（矩阵组合）
      - name: Run make (DEBUG=${{ matrix.DEBUG }}, ARCH=${{ matrix.ARCH }})
        shell: cmd
        run: |
          echo "Running make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}"
          echo "Current directory: %CD%"
          echo "PATH: %PATH%"
          make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}
          if %errorlevel% neq 0 (
              echo "Make failed with exit code %errorlevel%, retrying..."
              make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}
              if %errorlevel% neq 0 (
                  echo "Make failed again with exit code %errorlevel%, retrying one more time..."
                  make DEBUG=${{ matrix.DEBUG }} ARCH=${{ matrix.ARCH }}
              )
          )